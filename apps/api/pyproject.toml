[project]
name = "fuuud-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116","uvicorn[standard]>=0.35","sqlalchemy>=2.0","alembic>=1.16","psycopg[binary]>=3.2","pydantic-settings>=2.10","pyjwt>=2.10","pwdlib[argon2]>=0.2","email-validator>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8.4","httpx>=0.28","ruff>=0.12","mypy>=1.17"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["B008"] # FastAPI dependency injection convention.
