services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: fuuud, POSTGRES_USER: fuuud, POSTGRES_PASSWORD: fuuud}
    ports: ["5432:5432"]
    volumes: ["fuuud_postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U fuuud"], interval: 5s, timeout: 5s, retries: 10}
volumes: {fuuud_postgres: {}}
